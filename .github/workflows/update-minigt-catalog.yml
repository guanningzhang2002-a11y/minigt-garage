name: Update MINI GT catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * 1"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check official MINI GT catalog
        run: MINIGT_MAX_NUMBER=2000 node tools/audit-official-catalog.mjs
      - name: Commit new official models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minigt-catalog.js assets/minigt-image-candidates.js assets/minigt-missing-catalog-report.json
          git diff --cached --quiet || git commit -m "Update official MINI GT catalog"
          git push
